apiVersion: v1
kind: Namespace
metadata:
  name: mdconverter
---
# Blue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdconverter-blue
  namespace: mdconverter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: blue
  template:
    metadata:
      labels:
        app: web
        version: blue
    spec:
      containers:
        - name: web
          image: mdconverter:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
---
# Green
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdconverter-green
  namespace: mdconverter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      containers:
        - name: web
          image: mdconverter:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: ENABLE_OCR
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
---
# Switch de trafico
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mdconverter
spec:
  selector:
    app: web
    version: blue
  ports:
    - port: 80
      targetPort: 8000
